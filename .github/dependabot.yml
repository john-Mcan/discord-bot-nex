version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # @types/node sigue a la versión de Node que corre el bot (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint todavía no soporta TypeScript 6.1 o superior.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
